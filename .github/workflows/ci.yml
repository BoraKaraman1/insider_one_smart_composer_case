# CI. Step 0's checks are the lint-test and integration jobs. Stream 4 adds
# fuzz, the mock eval, image builds and a secret scan.
# The key is empty in every job. Nothing here reads a repository secret.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Rule 1: CI never has the key, and it never calls the real model.
  ANTHROPIC_API_KEY: ""
  LLM_MODE: mock

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        # honnef.co/go/tools v0.8.2 (release 2026.2.2). MIT. Builds on Go 1.26.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...
      - name: unit tests
        run: go test -race -count=3 -timeout 5m ./...
      - name: govulncheck
        # golang.org/x/vuln v1.9.0. Blocking.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: hook tests
        run: make -s test-hooks

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test # throwaway CI server only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: postgres client
        run: sudo apt-get update -y && sudo apt-get install -y postgresql-client
      - name: build the test template
        env:
          DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/app_template?sslmode=disable
        run: |
          psql -h 127.0.0.1 -U postgres -q -c 'CREATE DATABASE app_template'
          go run ./cmd/app migrate
          go run ./cmd/app seed -as-of 2026-01-01T00:00:00Z -seed 42 -users 5000
      - name: integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
          REQUIRE_DB: "1"
        run: go test -race -count=1 -timeout 5m ./...

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: fuzz
        run: |
          go test -run='^$' -fuzz=FuzzExtractFieldsNeverPanics -fuzztime=30s ./internal/llm
          go test -run='^$' -fuzz=FuzzExtractFieldsPrefix -fuzztime=30s ./internal/llm
          go test -run='^$' -fuzz=FuzzCompileShape -fuzztime=30s ./internal/segment
          go test -run='^$' -fuzz=FuzzParse -fuzztime=30s ./internal/content

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: unit tests
        run: npm test
      - name: build
        run: npm run build

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # actions: write is the artifact upload. The workflow default stays contents: read.
    permissions:
      contents: read
      actions: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test # throwaway CI server only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: postgres client
        run: sudo apt-get update -y && sudo apt-get install -y postgresql-client
      - name: build the test template
        env:
          DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/app_template?sslmode=disable
        run: |
          psql -h 127.0.0.1 -U postgres -q -c 'CREATE DATABASE app_template'
          go run ./cmd/app migrate
          go run ./cmd/app seed -as-of 2026-01-01T00:00:00Z -seed 42 -users 5000
      - name: eval
        env:
          EVAL_ADMIN_URL: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
        run: go run ./cmd/app eval
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report-mock
          path: evals/report-mock.md
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # actions: write is the build cache. The workflow default stays contents: read.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: smart-campaign-composer:local
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          push: false
          load: true
          provenance: false
          tags: smart-campaign-composer-web:local
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: e2e dependencies
        working-directory: web
        run: npm ci
      - name: start the stack
        run: docker compose up -d --wait
      - name: smoke
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/readyz
          curl -fsS -o /dev/null http://127.0.0.1:8081/
          curl -fsS http://127.0.0.1:9090/metrics | grep -q worker_last_processed_timestamp_seconds
          curl -fsS -X POST http://127.0.0.1:8080/api/audience/count \
            -H "Authorization: Bearer dev-admin-token" \
            -H "Content-Type: application/json" \
            --data-binary @- <<EOF
          {"rule": $(cat docs/examples/istanbul_cart_abandoners.json)}
          EOF
      - name: nginx scenarios
        run: make e2e

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # github.token, not a repository secret. Comments stay off so this
          # job needs no extra permission. A personal account needs no license.
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
